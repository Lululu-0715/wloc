# Quantumult X 配置片段 — 追加到你的配置文件对应段落下
# 在线选点页：https://wloc-1993.575613136.workers.dev
# 注意：QX 的 rewrite 脚本不支持 argument 传参，坐标通过两种方式设置：
#   1) 在线选点（推荐）：在选点页选点保存，坐标会写入 $prefs
#   2) 直接修改 scripts/wloc.js 里的 DEFAULT_CONFIG 默认值
# 授权控制：QX 无法传 licenseKey 参数，给受控用户使用时，
#   请为该用户单独改 scripts/wloc.js 的 DEFAULT_CONFIG.licenseKey，
#   重新 pnpm run build 后把 dist/wloc.js 提供给他。
# 脚本地址已配置好（Lululu-0715/wloc），追加到配置文件即用。
# 另：请使用较新版本 QX（支持 $response.bodyBytes 与 $done({bodyBytes})）。

[rewrite_local]
# 核心：拦截网络定位响应并改写坐标
^https?:\/\/gs-loc(-cn)?\.apple\.com\/clls\/wloc url script-response-body https://raw.githubusercontent.com/Lululu-0715/wloc/main/dist/wloc.js
# 选点：拦截 /wloc-settings/save 写入持久化存储（在线选点页会请求这个地址）
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/Lululu-0715/wloc/main/dist/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com
